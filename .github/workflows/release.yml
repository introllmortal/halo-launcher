name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          for d in HaloLauncher-Windows-MSVC-Portable*; do
            [ -d "${d}" ] || continue
            (cd "${d}" && zip -r -9 "../HaloLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip" *)
          done

          for d in HaloLauncher-Windows-MSVC-Setup*; do
            [ -d "${d}" ] || continue
            for f in "${d}"/HaloLauncher-*.exe; do
              [ -e "$f" ] && mv "$f" "HaloLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe"
            done
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Halo Launcher ${{ env.VERSION }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            HaloLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
