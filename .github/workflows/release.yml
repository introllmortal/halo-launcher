name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "HaloLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/HaloLauncher-source HaloLauncher-${{ env.VERSION }}
          mv HaloLauncher-Linux-Qt6-Portable*/HaloLauncher-portable.tar.gz HaloLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv HaloLauncher-Linux-aarch64-Qt6-Portable*/HaloLauncher-portable.tar.gz HaloLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv HaloLauncher-*.AppImage/HaloLauncher-*-x86_64.AppImage HaloLauncher-Linux-x86_64.AppImage
          mv HaloLauncher-*.AppImage.zsync/HaloLauncher-*-x86_64.AppImage.zsync HaloLauncher-Linux-x86_64.AppImage.zsync
          mv HaloLauncher-*.AppImage/HaloLauncher-*-aarch64.AppImage HaloLauncher-Linux-aarch64.AppImage
          mv HaloLauncher-*.AppImage.zsync/HaloLauncher-*-aarch64.AppImage.zsync HaloLauncher-Linux-aarch64.AppImage.zsync
          mv HaloLauncher-macOS*/HaloLauncher.zip HaloLauncher-macOS-${{ env.VERSION }}.zip
          mv HaloLauncher-macOS*/HaloLauncher.dmg HaloLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf HaloLauncher-${{ env.VERSION }}.tar.gz HaloLauncher-${{ env.VERSION }}

          for d in HaloLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="HaloLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv HaloLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in HaloLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="HaloLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv HaloLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in HaloLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="HaloLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv HaloLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: Halo Launcher ${{ env.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            HaloLauncher-Linux-x86_64.AppImage
            HaloLauncher-Linux-x86_64.AppImage.zsync
            HaloLauncher-Linux-aarch64.AppImage
            HaloLauncher-Linux-aarch64.AppImage.zsync
            HaloLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            HaloLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            HaloLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            HaloLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            HaloLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            HaloLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            HaloLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            HaloLauncher-macOS-${{ env.VERSION }}.zip
            HaloLauncher-macOS-${{ env.VERSION }}.dmg
            HaloLauncher-${{ env.VERSION }}.tar.gz
