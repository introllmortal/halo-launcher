name: Suggestion
description: Suggest a small improvement or quality-of-life change
labels: ["type: enhancement", "status: needs triage"]
body:
- type: markdown
  attributes:
    value: |
      ### Suggest an improvement for Halo Launcher.
- type: input
  attributes:
    label: Summary
    description: Short description of the idea.
  validations:
    required: true
- type: textarea
  attributes:
    label: Details & Benefit
    description: How should it work, and how would it improve daily use?
  validations:
    required: true
