name: Feature Request / RFC
description: Propose a new feature or architectural improvement for Halo Launcher
labels: ["type: enhancement", "status: needs discussion"]
body:
- type: markdown
  attributes:
    value: |
      ### Use this form to propose a larger change or new subsystem in Halo Launcher.
- type: textarea
  attributes:
    label: Goal
    description: Short summary in 1–2 sentences.
  validations:
    required: true
- type: textarea
  attributes:
    label: Motivation
    description: Why is this needed, and what problem does it solve?
  validations:
    required: true
- type: textarea
  attributes:
    label: Proposed Design
    description: Concrete details on UX, UI, or implementation approach.
  validations:
    required: true
- type: textarea
  attributes:
    label: Trade-offs & Alternatives
    description: Known limitations or alternative solutions considered.
  validations:
    required: false
