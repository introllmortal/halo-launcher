name: Bug Report
description: Report a bug in Halo Launcher
labels: ["bug: unconfirmed", "status: needs triage"]
body:
- type: markdown
  attributes:
    value: |
      Before submitting a bug report, please make sure:
      * The issue happens on the latest version of Halo Launcher.
      * The bug is inside the launcher itself rather than a specific Minecraft mod or resource pack.
      * You have searched [existing issues](https://github.com/introllmortal/halo-launcher/issues) so duplicates are avoided.
- type: dropdown
  attributes:
    label: Operating System
    description: Select all operating systems where this bug occurs.
    multiple: true
    options:
    - Windows
    - Linux
    - macOS
    - Other
- type: input
  attributes:
    label: Version of Halo Launcher
    description: Check Help -> About Halo Launcher (or the title bar).
    placeholder: Halo Launcher 1.2.3
  validations:
    required: true
- type: input
  attributes:
    label: Version of Qt
    description: Found under Help -> About Halo Launcher -> About Qt.
    placeholder: Qt 6.10.2
  validations:
    required: true
- type: textarea
  attributes:
    label: Description of bug
    description: What did you expect to happen, what actually happened, and why is it incorrect?
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to reproduce
    description: Concise step-by-step instructions (and relevant logs or Crash Assistant output if applicable).
    placeholder: |
      1. Open Halo Launcher
      2. Select an instance
      3. ...
  validations:
    required: true
- type: textarea
  attributes:
    label: Suspected cause or logs
    description: Optional log excerpt or mclo.gs link.
  validations:
    required: false
